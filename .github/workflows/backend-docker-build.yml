# 백엔드·프론트엔드가 빌드되는지 푸시·PR 단계에서 미리 확인한다.
#
# 왜 필요한가:
#   GitHub Actions는 **워크플로를 실패시킨 커밋의 작성자에게 자동으로 메일을 보낸다.**
#   그래서 배포 워크플로(deploy-dev-box.yml·deploy-prod.yml)까지 가기 전에, 푸시한 사람이
#   타입 에러·빌드 실패를 바로 알게 된다.
#
# 받는 사람이 메일을 못 받고 있다면:
#   GitHub → Settings → Notifications → Actions → "Send notifications for failed
#   workflows only" 체크 + Email 활성화 (기본값이지만 꺼놨을 수 있음)
#
# 이 워크플로가 잡아주는 것: prisma generate 스키마 누락, COPY 대상 없음(.dockerignore
# 오설정), lockfile 불일치, tsc 타입 에러, next build 실패 등.

name: Build check

# - push는 dev·main만 검사한다. 기능 브랜치는 PR에서 검사한다 (브랜치 push까지 돌면
#   같은 변경을 세 번 빌드하고, 캐시가 없는 브랜치 실행이 PR 화면에 4~10분 걸려 있었다).
#   PR 없이 push만 하는 브랜치는 .githooks/pre-push 가 대신 검사한다.
# - 워크플로 단위 paths 필터는 두지 않는다. 대신 첫 잡(changes)이 바뀐 경로를 판정하고,
#   각 잡은 자기 몫의 경로가 바뀐 경우에만 돈다. 수동 실행은 전부 돈다.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

# 같은 브랜치에서 연속 푸시하면 이전 실행은 취소
concurrency:
  group: backend-docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 바뀐 파일로 어느 잡을 돌릴지 정한다. 외부 액션 없이 git diff 만 쓴다.
  #   PR    : 병합 미리보기 커밋(refs/pull/N/merge)과 첫 부모(지금의 대상 브랜치)의 차이
  #   push  : 직전 tip(event.before)과 이번 tip의 차이. before 를 모르면 전부 돈다.
  # 경로 목록은 각 빌드가 실제로 읽는 파일과 같다 (Dockerfile 의 COPY).
  changes:
    name: 바뀐 경로 판정
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      aws_backend: ${{ steps.filter.outputs.aws_backend }}
      aws_frontend: ${{ steps.filter.outputs.aws_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=false
          changed=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            all=true
          elif [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=true
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi

          # 공용 매니페스트나 이 워크플로가 바뀌면 모든 잡이 영향을 받는다.
          shared='^(package\.json|yarn\.lock|\.node-version|\.github/workflows/backend-docker-build\.yml)$'
          out() {
            if [ "$all" = true ] || grep -qE "$2|$shared" <<<"$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          out backend '^apps/backend/'
          out frontend '^apps/frontend/'
          out aws_backend '^apps/backend/|^apps/frontend/package\.json$|^\.dockerignore$'
          out aws_frontend '^apps/frontend/|^apps/backend/package\.json$|^\.dockerignore$'

          {
            echo "### 바뀐 경로 판정"
            if [ "$all" = true ]; then echo "전체 검사 (${EVENT})"; else echo '```'; echo "${changed:-(없음)}"; echo '```'; fi
            echo '```'; cat "$GITHUB_OUTPUT"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 운영 빌드(tsconfig.json)는 테스트를 제외하므로, 테스트 파일의 타입 에러는
  # docker build가 잡지 못한다. 그 몫을 이 잡이 맡는다.
  # (로컬에서는 .githooks/pre-push 가 푸시 전에 같은 검사를 돌린다.)
  typecheck:
    name: 타입 검사 (테스트 포함)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - name: 실패 안내
        if: failure()
        run: |
          echo "::error::타입 에러입니다. 배포는 막히지 않지만 테스트가 깨진 상태입니다."
          {
            echo "### ❌ 타입 검사 실패"
            echo ""
            echo "테스트 파일을 포함한 타입 검사에서 에러가 났습니다."
            echo "로컬에서 \`yarn typecheck\` 으로 같은 결과를 볼 수 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"

  # 프론트엔드 이미지 빌드(아래 frontend-image)는 push 에서 돌지 않으므로, main·dev push 에서도
  # next build 가 깨지지 않았는지 여기서 확인한다.
  frontend:
    name: next build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn workspace @pmcs/frontend build

      - name: 실패 안내
        if: failure()
        run: |
          echo "::error::AWS 프론트엔드 이미지 빌드도 같은 이유로 실패합니다."
          {
            echo "### ❌ 프론트엔드 빌드 실패"
            echo ""
            echo "배포(이미지 빌드)에서도 **같은 지점에서 실패**합니다. 머지 전에 고쳐주세요."
            echo ""
            echo "로컬에서 \`yarn workspace @pmcs/frontend build\` 로 같은 결과를 볼 수 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"

  # AWS 이미지 두 개는 PR 에서만 돈다(캐시는 읽기만). push 에서는 deploy-dev-box.yml(dev)·
  # deploy-prod.yml(main)이 build-images.yml 로 같은 이미지를 빌드해 ECR 에 올리고, dev push 가
  # 캐시(scope 동일)를 쓴다. PR 은 대상 브랜치(dev)의 캐시를 읽을 수 있다.

  # AWS 프론트엔드 컨테이너 이미지 (arm64, apps/frontend/Dockerfile).
  frontend-image:
    name: docker build (AWS 프론트엔드)
    needs: changes
    if: needs.changes.outputs.aws_frontend == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend-image

  # AWS 백엔드 컨테이너 이미지 (arm64, apps/backend/Dockerfile).
  backend-image:
    name: docker build (AWS 백엔드)
    needs: changes
    if: needs.changes.outputs.aws_backend == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend-image
