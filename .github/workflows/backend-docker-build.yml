# Railway가 쓰는 것과 **동일한** Dockerfile로 이미지를 미리 빌드해서,
# Railway 배포 실패를 푸시한 사람이 직접 알 수 있게 한다.
#
# 왜 필요한가:
#   Railway 빌드 로그는 Railway 대시보드에서만 보인다. 그래서 백엔드 빌드가 깨지면
#   대시보드를 보는 사람만 알게 되고, 정작 푸시한 사람은 모른 채 넘어간다.
#   GitHub Actions는 **워크플로를 실패시킨 커밋의 작성자에게 자동으로 메일을 보낸다.**
#   → 푸시한 사람이 Railway 계정 없이도 같은 실패 로그를 즉시 받는다.
#
# 받는 사람이 메일을 못 받고 있다면:
#   GitHub → Settings → Notifications → Actions → "Send notifications for failed
#   workflows only" 체크 + Email 활성화 (기본값이지만 꺼놨을 수 있음)
#
# 이 워크플로가 잡아주는 것: prisma generate 스키마 누락, COPY 대상 없음(.dockerignore
# 오설정), lockfile 불일치, tsc 타입 에러 등 — 전부 Railway에서 터지던 것들.

name: Build check (Railway · Netlify)

# - push는 dev·main만 검사한다. 기능 브랜치는 PR에서 검사한다 (브랜치 push까지 돌면
#   같은 변경을 세 번 빌드하고, 캐시가 없는 브랜치 실행이 PR 화면에 4~10분 걸려 있었다).
#   PR 없이 push만 하는 브랜치는 .githooks/pre-push 가 대신 검사한다.
# - 워크플로 단위 paths 필터는 두지 않는다. 대신 첫 잡(changes)이 바뀐 경로를 판정하고,
#   각 잡은 자기 몫의 경로가 바뀐 경우에만 돈다. 수동 실행은 전부 돈다.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

# 같은 브랜치에서 연속 푸시하면 이전 실행은 취소
concurrency:
  group: backend-docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 바뀐 파일로 어느 잡을 돌릴지 정한다. 외부 액션 없이 git diff 만 쓴다.
  #   PR    : 병합 미리보기 커밋(refs/pull/N/merge)과 첫 부모(지금의 대상 브랜치)의 차이
  #   push  : 직전 tip(event.before)과 이번 tip의 차이. before 를 모르면 전부 돈다.
  # 경로 목록은 각 빌드가 실제로 읽는 파일과 같다 (Dockerfile 의 COPY, railway.toml 의 watchPatterns).
  changes:
    name: 바뀐 경로 판정
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      railway: ${{ steps.filter.outputs.railway }}
      aws_backend: ${{ steps.filter.outputs.aws_backend }}
      aws_frontend: ${{ steps.filter.outputs.aws_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=false
          changed=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            all=true
          elif [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=true
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi

          # 공용 매니페스트나 이 워크플로가 바뀌면 모든 잡이 영향을 받는다.
          shared='^(package\.json|yarn\.lock|\.node-version|\.github/workflows/backend-docker-build\.yml)$'
          out() {
            if [ "$all" = true ] || grep -qE "$2|$shared" <<<"$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          out backend '^apps/backend/'
          out frontend '^apps/frontend/|^netlify\.toml$'
          out railway '^apps/backend/|^apps/frontend/package\.json$|^Dockerfile$|^\.dockerignore$|^railway\.toml$'
          out aws_backend '^apps/backend/|^apps/frontend/package\.json$'
          out aws_frontend '^apps/frontend/|^apps/backend/package\.json$'

          {
            echo "### 바뀐 경로 판정"
            if [ "$all" = true ]; then echo "전체 검사 (${EVENT})"; else echo '```'; echo "${changed:-(없음)}"; echo '```'; fi
            echo '```'; cat "$GITHUB_OUTPUT"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 운영 빌드(tsconfig.json)는 테스트를 제외하므로, 테스트 파일의 타입 에러는
  # docker build가 잡지 못한다. 그 몫을 이 잡이 맡는다.
  # (로컬에서는 .githooks/pre-push 가 푸시 전에 같은 검사를 돌린다.)
  typecheck:
    name: 타입 검사 (테스트 포함)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - name: 실패 안내
        if: failure()
        run: |
          echo "::error::타입 에러입니다. 배포는 막히지 않지만 테스트가 깨진 상태입니다."
          {
            echo "### ❌ 타입 검사 실패"
            echo ""
            echo "테스트 파일을 포함한 타입 검사에서 에러가 났습니다."
            echo "로컬에서 \`yarn typecheck\` 으로 같은 결과를 볼 수 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"

  # Netlify 배포 실패도 푸시한 사람이 바로 알 수 있게 같은 빌드를 여기서 돌린다.
  # (Netlify 체크는 "Deploy failed" 만 보여주고 원인 로그는 Netlify 대시보드에 있다.)
  frontend:
    name: next build (Netlify와 동일)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn workspace @pmcs/frontend build

      - name: 실패 안내
        if: failure()
        run: |
          echo "::error::Netlify 배포도 같은 이유로 실패합니다."
          {
            echo "### ❌ 프론트엔드 빌드 실패"
            echo ""
            echo "Netlify에 올라가도 **같은 지점에서 실패**합니다. 머지 전에 고쳐주세요."
            echo ""
            echo "로컬에서 \`yarn workspace @pmcs/frontend build\` 로 같은 결과를 볼 수 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"

  # docker 빌드 캐시(type=gha)는 dev push 에서만 쓴다. PR·main 은 읽기만 한다.
  # 저장소 캐시 한도는 10GB인데 Railway 이미지 캐시 하나가 약 4GB라, PR·브랜치마다 쓰면
  # 서로 밀어내서 dev push 가 매번 처음부터 빌드했다 (AWS 프론트엔드 4~6분).
  # PR 은 대상 브랜치(dev)의 캐시를 읽을 수 있다.

  # AWS 프론트엔드 컨테이너 이미지 (dev 서버가 쓰는 arm64). 지금 운영(Netlify)과는 무관하다.
  frontend-image:
    name: docker build (AWS 프론트엔드)
    needs: changes
    if: needs.changes.outputs.aws_frontend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend-image
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'type=gha,mode=max,scope=frontend-image' || '' }}

  # AWS 백엔드 이미지 (apps/backend/Dockerfile, arm64). Railway 는 루트 Dockerfile 을 쓰므로
  # 운영과는 무관하다.
  backend-image:
    name: docker build (AWS 백엔드)
    needs: changes
    if: needs.changes.outputs.aws_backend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend-image
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'type=gha,mode=max,scope=backend-image' || '' }}

  # Railway 운영이 쓰는 루트 Dockerfile. main 은 PR 없이 반영되고 Railway 빌드와 동시에 돌아
  # 사전 경고가 되지 못하므로, dev·PR 단계에서 잡는 것이 운영 보호의 핵심이다.
  build:
    name: docker build (Railway와 동일)
    needs: changes
    if: needs.changes.outputs.railway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # DATABASE_URL 불필요: prisma generate는 datasource URL 없이도 동작 (Prisma 7.2+)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'type=gha,mode=max' || '' }}

      - name: 실패 안내
        if: failure()
        run: |
          echo "::error::Railway 배포도 같은 이유로 실패합니다. 위 'Build image' 단계 로그를 확인하세요."
          {
            echo "### ❌ 백엔드 Docker 빌드 실패"
            echo ""
            echo "Railway에 올라가도 **같은 지점에서 실패**합니다. 머지 전에 고쳐주세요."
            echo ""
            echo "위 \`Build image\` 단계의 로그가 Railway 빌드 로그와 동일합니다."
          } >> "$GITHUB_STEP_SUMMARY"
