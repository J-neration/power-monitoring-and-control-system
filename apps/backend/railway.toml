# Railway Root Directory = apps/backend 일 때 사용되는 설정.
# NIXPACKS는 소스 복사 전에 install을 돌려 postinstall의 prisma generate가
# schema.prisma를 못 찾고 깨진다 → Dockerfile 빌더를 명시적으로 고정.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c '(npx prisma migrate deploy && echo migrate_ok) || echo migrate_failed; node dist/src/index.js'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
