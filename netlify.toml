# 공통 빌드 설정
[build]
  base = "apps/frontend"
  command = "yarn build"
  publish = ".next"

# NEXT_PUBLIC_API_BASE / COMMAND_API_BASE 는 Netlify 대시보드 Environment variables 에서
# Production / Branch deploys(dev) / Deploy Previews context 별로 관리합니다.
# (미지정 시 대시보드 기본값이 Prod를 가리키면 프리뷰가 실서비스 DB를 칠 수 있음)

# 보안 헤더 (모든 경로)
# CSP 는 인라인 스크립트/지도/3rd-party 영향이 커 별도 신중 적용 — 여기서는 제외.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-DNS-Prefetch-Control = "off"
